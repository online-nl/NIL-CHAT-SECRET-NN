<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Shield / Bubble Icon -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Chat Bubble Shield -->
    <path d="M150 16 C80 16 24 66 24 130 C24 165 42 196 72 216 L56 268 L114 242 C125 244 137 245 150 245 C220 245 276 195 276 130 C276 66 220 16 150 16 Z" 
          fill="url(#accentGrad)" />

    <!-- Inner Keyhole / Lock / Signal -->
    <path d="M150 78 C132 78 118 92 118 110 C118 122 125 133 135 138 L128 178 L172 178 L165 138 C175 133 182 122 182 110 C182 92 168 78 150 78 Z" 
          fill="#ffffff" />
          
    <circle cx="150" cy="110" r="10" fill="#0b0f19" />
  </g>

  <!-- Stylized Branding Dots -->
  <circle cx="206" cy="410" r="8" fill="#38bdf8" />
  <circle cx="256" cy="410" r="12" fill="#6366f1" />
  <circle cx="306" cy="410" r="8" fill="#a855f7" />
</svg>
